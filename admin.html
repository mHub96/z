<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>نظام المقيمين · المستشفى</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'IBM Plex Sans Arabic', sans-serif;
            direction: rtl;
            text-align: right;
            min-height: 100vh;
            padding: 0;
            transition: background 0.6s ease, color 0.4s ease;
            overflow-x: hidden;
        }

        /* ============================================================
           LIGHT THEME
        ============================================================ */
        body.light {
            background: #f2f6fc;
            color: #1a2332;
        }
        body.light .bg-surface {
            background: #ffffff;
        }
        body.light .bg-surface2 {
            background: #f8fafc;
        }
        body.light .text-primary {
            color: #1a2332;
        }
        body.light .text-secondary {
            color: #475569;
        }
        body.light .border-subtle {
            border-color: #e2e8f0;
        }
        body.light .glass-card {
            background: rgba(255, 255, 255, 0.78);
            backdrop-filter: blur(14px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.05);
        }
        body.light .spec-header {
            background: rgba(255, 255, 255, 0.5);
            border-color: rgba(255, 255, 255, 0.4);
        }
        body.light .resident-card {
            background: rgba(255, 255, 255, 0.7);
            border-color: rgba(255, 255, 255, 0.3);
        }
        body.light .resident-card:hover {
            border-color: #2563eb;
            box-shadow: 0 12px 28px rgba(0, 0, 0, 0.06);
        }
        body.light .input-field {
            background: rgba(255, 255, 255, 0.9);
            border-color: #e2e8f0;
            color: #1a2332;
        }
        body.light .btn-ghost {
            background: rgba(255, 255, 255, 0.5);
            border-color: rgba(0, 0, 0, 0.08);
            color: #1a2332;
        }
        body.light .btn-ghost:hover {
            background: rgba(255, 255, 255, 0.8);
        }
        body.light .lock-card {
            background: rgba(255, 255, 255, 0.88);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }
        body.light .modal-card {
            background: #ffffff;
        }
        
        /* LIGHT THEME BADGES - High contrast */
        body.light .badge-spec {
            background: #dbeafe;
            color: #1e40af;
            font-weight: 700;
        }
        body.light .badge-active {
            background: #d1fae5;
            color: #065f46;
            font-weight: 700;
        }
        body.light .badge-reserve {
            background: #fef3c7;
            color: #92400e;
            font-weight: 700;
        }
        body.light .spec-count {
            background: #dbeafe;
            color: #1e40af;
        }
        body.light .spec-count-reserve {
            background: #fef3c7;
            color: #92400e;
        }

        /* ============================================================
           DARK THEME — BLACK, GREY, GOLD
        ============================================================ */
        body.dark {
            background: #0b0e12;
            color: #e8edf5;
        }
        body.dark::before {
            content: '';
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            opacity: 0.08;
            background-image: url("data:image/svg+xml,%3Csvg width='120' height='120' viewBox='0 0 120 120' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23d4af37' fill-opacity='0.25'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
            background-size: 120px 120px;
        }

        body.dark .bg-surface {
            background: #141a24;
        }
        body.dark .bg-surface2 {
            background: #0f151e;
        }
        body.dark .text-primary {
            color: #f0f3f8;
        }
        body.dark .text-secondary {
            color: #a8b3c9;
        }
        body.dark .border-subtle {
            border-color: #2a3346;
        }

        body.dark .glass-card {
            background: rgba(16, 22, 34, 0.82);
            backdrop-filter: blur(14px);
            border: 1px solid rgba(212, 175, 55, 0.12);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
        }

        body.dark .spec-header {
            background: rgba(20, 28, 44, 0.6);
            border-color: rgba(212, 175, 55, 0.08);
            color: #f0f3f8;
        }
        body.dark .spec-header:hover {
            background: rgba(30, 40, 60, 0.6);
        }
        
        /* DARK THEME BADGES - High contrast */
        body.dark .badge-spec {
            background: rgba(212, 175, 55, 0.15);
            color: #d4af37;
            font-weight: 700;
        }
        body.dark .badge-active {
            background: rgba(16, 185, 129, 0.15);
            color: #6ee7b7;
            font-weight: 700;
        }
        body.dark .badge-reserve {
            background: rgba(251, 191, 36, 0.12);
            color: #fbbf24;
            font-weight: 700;
        }
        body.dark .spec-count {
            background: rgba(212, 175, 55, 0.15);
            color: #d4af37;
        }
        body.dark .spec-count-reserve {
            background: rgba(251, 191, 36, 0.12);
            color: #fbbf24;
        }

        body.dark .resident-card {
            background: rgba(14, 20, 32, 0.7);
            border-color: rgba(212, 175, 55, 0.06);
        }
        body.dark .resident-card:hover {
            border-color: #d4af37;
            box-shadow: 0 12px 28px rgba(0, 0, 0, 0.5);
        }

        body.dark .input-field {
            background: rgba(10, 14, 24, 0.9);
            border-color: #2a3346;
            color: #f0f3f8;
        }
        body.dark .input-field:focus {
            border-color: #d4af37;
            box-shadow: 0 0 0 4px rgba(212, 175, 55, 0.12);
        }
        body.dark .input-field::placeholder {
            color: #6a7a94;
        }

        body.dark .btn-ghost {
            background: rgba(255, 255, 255, 0.04);
            border-color: rgba(212, 175, 55, 0.12);
            color: #f0f3f8;
        }
        body.dark .btn-ghost:hover {
            background: rgba(212, 175, 55, 0.08);
            border-color: rgba(212, 175, 55, 0.25);
        }

        body.dark .lock-card {
            background: rgba(12, 18, 30, 0.92);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(212, 175, 55, 0.12);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6);
        }
        body.dark .lock-card .text-primary {
            color: #f0f3f8;
        }
        body.dark .lock-card .text-secondary {
            color: #a8b3c9;
        }

        body.dark .modal-card {
            background: #141c2a;
            border: 1px solid rgba(212, 175, 55, 0.08);
        }

        body.dark .btn-gradient {
            background: linear-gradient(135deg, #d4af37, #b8942e);
            box-shadow: 0 8px 24px rgba(212, 175, 55, 0.2);
            color: #0b0e12;
        }
        body.dark .btn-gradient:hover {
            box-shadow: 0 12px 32px rgba(212, 175, 55, 0.3);
        }

        body.dark .text-blue-600 {
            color: #d4af37 !important;
        }
        body.dark .text-blue-500 {
            color: #d4af37 !important;
        }
        body.dark .bg-blue-50 {
            background: rgba(212, 175, 55, 0.06) !important;
        }
        body.dark .bg-blue-100 {
            background: rgba(212, 175, 55, 0.10) !important;
        }
        body.dark .text-blue-700 {
            color: #d4af37 !important;
        }
        body.dark .border-blue-500 {
            border-color: rgba(212, 175, 55, 0.2) !important;
        }
        body.dark .shadow-blue-500\/30 {
            box-shadow: 0 8px 24px rgba(212, 175, 55, 0.15) !important;
        }
        body.dark .from-blue-500 {
            --tw-gradient-from: #d4af37 !important;
        }
        body.dark .to-blue-600 {
            --tw-gradient-to: #b8942e !important;
        }
        body.dark .bg-gradient-to-br {
            background-image: linear-gradient(to bottom right, #d4af37, #b8942e) !important;
        }

        body.dark .bg-blue-600 {
            background: #d4af37 !important;
        }
        body.dark .hover\:bg-blue-700:hover {
            background: #b8942e !important;
        }
        body.dark .text-white {
            color: #f0f3f8 !important;
        }
        body.dark .border-amber-200 {
            border-color: rgba(212, 175, 55, 0.2) !important;
        }
        body.dark .bg-amber-50 {
            background: rgba(212, 175, 55, 0.06) !important;
        }
        body.dark .text-amber-600 {
            color: #d4af37 !important;
        }
        body.dark .text-amber-700 {
            color: #d4af37 !important;
        }
        body.dark .bg-amber-100 {
            background: rgba(212, 175, 55, 0.10) !important;
        }
        body.dark .text-amber-500 {
            color: #d4af37 !important;
        }
        body.dark .bg-amber-500 {
            background: #d4af37 !important;
        }
        body.dark .from-amber-500 {
            --tw-gradient-from: #d4af37 !important;
        }
        body.dark .to-amber-600 {
            --tw-gradient-to: #b8942e !important;
        }
        body.dark .ring-amber-500 {
            --tw-ring-color: #d4af37 !important;
        }
        body.dark .shadow-amber-500\/20 {
            box-shadow: 0 8px 24px rgba(212, 175, 55, 0.15) !important;
        }
        body.dark .accent-amber-500 {
            accent-color: #d4af37 !important;
        }

        body.dark .toast-success {
            background: #10b981;
            color: white;
        }
        body.dark .toast-error {
            background: #ef4444;
            color: white;
        }
        body.dark .toast-info {
            background: #3b82f6;
            color: white;
        }

        /* ============================================================
           SHARED STYLES
        ============================================================ */
        .glass-card {
            border-radius: 1.5rem;
            transition: all 0.3s ease;
            position: relative;
            z-index: 1;
        }

        .input-field {
            border-radius: 1rem;
            padding: 0.9rem 1.4rem;
            font-weight: 500;
            transition: all 0.3s ease;
            width: 100%;
            border: 2px solid;
            outline: none;
        }
        .input-field:focus {
            transform: translateY(-1px);
        }

        .btn-gradient {
            border: none;
            font-weight: 700;
            padding: 0.9rem 2rem;
            border-radius: 1.2rem;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.6rem;
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            color: white;
            box-shadow: 0 8px 24px rgba(37, 99, 235, 0.3);
        }
        .btn-gradient:hover {
            transform: translateY(-2px) scale(1.01);
        }
        .btn-gradient:active {
            transform: scale(0.97);
        }

        .btn-ghost {
            border-radius: 1.2rem;
            padding: 0.6rem 1.4rem;
            font-weight: 600;
            transition: all 0.3s ease;
            cursor: pointer;
            border: 1px solid;
        }

        .resident-card {
            border-radius: 1.2rem;
            padding: 1rem 1.5rem;
            margin-bottom: 0.6rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            border: 1px solid;
        }

        .spec-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.8rem 1.2rem;
            border-radius: 1.2rem;
            margin: 0.25rem 0;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 1px solid;
            font-weight: 700;
        }
        .spec-header:hover {
            transform: translateX(-4px);
        }

        .spec-content {
            display: none;
            padding: 0.25rem 0;
            animation: slideDown 0.3s ease;
        }
        .spec-content.active {
            display: block;
        }

        @keyframes slideDown {
            0% {
                opacity: 0;
                transform: translateY(-8px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .badge-spec,
        .badge-active,
        .badge-reserve {
            font-size: 0.6rem;
            padding: 0.15rem 0.7rem;
            border-radius: 100px;
            font-weight: 700;
            display: inline-block;
        }

        .spec-count,
        .spec-count-reserve {
            font-size: 0.7rem;
            padding: 0.1rem 0.7rem;
            border-radius: 100px;
            font-weight: 700;
            display: inline-block;
        }

        .modal-overlay {
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(12px);
            position: fixed;
            inset: 0;
            z-index: 999;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: all 0.4s ease;
            padding: 1.5rem;
        }
        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }
        .modal-card {
            max-width: 480px;
            width: 100%;
            border-radius: 2rem;
            padding: 2rem 2rem;
            transform: scale(0.95) translateY(20px);
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: 0 40px 80px rgba(0, 0, 0, 0.2);
        }
        .modal-overlay.active .modal-card {
            transform: scale(1) translateY(0);
        }

        .lock-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 1.5rem;
            position: relative;
            z-index: 2;
        }
        .lock-card {
            border-radius: 2.5rem;
            padding: 2.5rem 2.2rem;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.08);
        }

        .hidden-content {
            display: none;
        }
        .phone-ltr {
            direction: ltr;
            unicode-bidi: plaintext;
        }

        .btn-save {
            transition: all 0.4s ease;
            min-width: 120px;
        }
        .btn-save.loading {
            background: #3b82f6 !important;
            color: white !important;
            cursor: wait;
        }
        .btn-save.success {
            background: #10b981 !important;
            color: white !important;
        }
        .btn-save.error {
            background: #ef4444 !important;
            color: white !important;
        }

        body.dark .btn-save.loading {
            background: #d4af37 !important;
            color: #0b0e12 !important;
        }
        body.dark .btn-save.success {
            background: #10b981 !important;
            color: white !important;
        }
        body.dark .btn-save.error {
            background: #ef4444 !important;
            color: white !important;
        }

        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #94a3b8;
            border-radius: 10px;
        }
        body.dark ::-webkit-scrollbar-thumb {
            background: #4a5568;
        }

        @media (max-width: 640px) {
            .lock-card {
                padding: 2rem 1.5rem;
            }
            .modal-card {
                padding: 1.5rem;
            }
        }

        /* ============================================================
           THEME TOGGLE — ANIMATED FLIP
        ============================================================ */
        .theme-toggle-wrap {
            perspective: 200px;
            display: inline-block;
        }
        .theme-toggle-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: 2px solid;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            transform-style: preserve-3d;
            background: rgba(255, 255, 255, 0.3);
            border-color: rgba(0, 0, 0, 0.1);
        }
        body.dark .theme-toggle-btn {
            background: rgba(212, 175, 55, 0.08);
            border-color: rgba(212, 175, 55, 0.2);
        }
        .theme-toggle-btn .icon-wrap {
            position: relative;
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .theme-toggle-btn .icon-wrap i {
            position: absolute;
            font-size: 1.1rem;
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            backface-visibility: hidden;
        }
        .theme-toggle-btn .icon-wrap .icon-moon {
            transform: rotateY(0deg);
            opacity: 1;
        }
        .theme-toggle-btn .icon-wrap .icon-sun {
            transform: rotateY(180deg);
            opacity: 0;
        }
        body.dark .theme-toggle-btn .icon-wrap .icon-moon {
            transform: rotateY(-180deg);
            opacity: 0;
        }
        body.dark .theme-toggle-btn .icon-wrap .icon-sun {
            transform: rotateY(0deg);
            opacity: 1;
        }
        .theme-toggle-btn .icon-wrap i.fa-moon {
            color: #1a2332;
        }
        body.dark .theme-toggle-btn .icon-wrap i.fa-moon {
            color: #f0f3f8;
        }
        .theme-toggle-btn .icon-wrap i.fa-sun {
            color: #fbbf24;
        }
        .theme-toggle-btn:hover {
            transform: scale(1.05);
        }
        body.dark .theme-toggle-btn:hover {
            border-color: rgba(212, 175, 55, 0.4);
        }

        /* Footer */
        .footer-credit {
            font-size: 0.7rem;
            opacity: 0.5;
            padding: 0.8rem 0;
            text-align: center;
            border-top: 1px solid rgba(128, 128, 128, 0.1);
            margin-top: 2rem;
        }
        body.dark .footer-credit {
            border-top-color: rgba(212, 175, 55, 0.05);
        }
        
        .lock-footer {
            margin-top: 1.5rem;
            font-size: 0.65rem;
            opacity: 0.4;
            text-align: center;
        }

        /* ============================================================
           TOAST NOTIFICATIONS
        ============================================================ */
        #toast-container {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            pointer-events: none;
            width: 90%;
            max-width: 420px;
        }
        .toast {
            padding: 14px 24px;
            border-radius: 1rem;
            font-weight: 600;
            font-size: 0.9rem;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.15);
            transform: translateY(-20px);
            opacity: 0;
            transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
            pointer-events: auto;
            display: flex;
            align-items: center;
            gap: 12px;
            width: 100%;
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .toast.show {
            transform: translateY(0);
            opacity: 1;
        }
        .toast.hide {
            transform: translateY(-20px);
            opacity: 0;
        }
        .toast i {
            font-size: 1.1rem;
            flex-shrink: 0;
        }
        .toast .toast-close {
            margin-right: auto;
            cursor: pointer;
            opacity: 0.6;
            transition: opacity 0.2s;
            background: none;
            border: none;
            color: inherit;
            font-size: 1rem;
            padding: 0 4px;
        }
        .toast .toast-close:hover {
            opacity: 1;
        }
        .toast-success {
            background: rgba(16, 185, 129, 0.92);
            color: white;
            border-color: rgba(255, 255, 255, 0.15);
        }
        .toast-error {
            background: rgba(239, 68, 68, 0.92);
            color: white;
            border-color: rgba(255, 255, 255, 0.15);
        }
        .toast-info {
            background: rgba(59, 130, 246, 0.92);
            color: white;
            border-color: rgba(255, 255, 255, 0.15);
        }
        body.dark .toast-success { background: rgba(16, 185, 129, 0.92); }
        body.dark .toast-error { background: rgba(239, 68, 68, 0.92); }
        body.dark .toast-info { background: rgba(59, 130, 246, 0.92); }
    </style>
</head>
<body class="light" id="app-body">

    <!-- TOAST CONTAINER -->
    <div id="toast-container"></div>

    <!-- LOCK SCREEN -->
    <div id="lock-screen" class="lock-screen">
        <div class="lock-card text-center">
            <div class="w-20 h-20 mx-auto mb-4 rounded-full bg-gradient-to-br from-blue-500 to-blue-600 flex items-center justify-center shadow-lg shadow-blue-500/30">
                <i class="fas fa-user-md text-3xl text-white"></i>
            </div>
            <h2 class="text-2xl font-black text-primary mb-1">🔐 بوابة المقيمين</h2>
            <p class="text-sm text-secondary mb-6">أدخل كلمة المرور للدخول</p>
            <div class="relative">
                <input type="password" id="password-input" placeholder="•••••"
                       class="input-field text-center text-xl tracking-[0.5rem] font-mono" maxlength="20">
                <button id="login-btn" onclick="handleLogin()" class="btn-gradient w-full mt-4">
                    <i class="fas fa-arrow-left ml-2"></i> Login
                </button>
                <p id="lock-error" class="text-red-500 text-sm mt-2 h-5"></p>
            </div>
            <div class="mt-4 flex items-center justify-center gap-3">
                <label class="flex items-center gap-2 text-sm text-secondary cursor-pointer">
                    <input type="checkbox" id="remember-me" checked class="w-4 h-4 accent-blue-500" /> تذكرني
                </label>
            </div>
            <div class="lock-footer text-secondary">
                All rights reserved for Dr. Mohammed Riyadh
            </div>
        </div>

    <script>
        // ========== CONFIG ==========
        const CONFIG = { user: "mHub96", repo: "z", path: "data.json" };
        const _p = ["ghp_", "dAUtsFhTH", "a2KeJQO", "sxsCCt1v", "z8z1Z63Am", "sjS"];
        const GH_TOKEN = _p.join('');

        // ========== STATE ==========
        let db = { names: [], schedule: [], passwords: {} };
        let fileSha = "";
        let currentEditIdx = null;
        let isAdmin = false;
        let isDataLoaded = false;
        let isAutoLoginAttempted = false;
        let isLockScreenHidden = false;

        const specialties = [
            { id: "NS", name: "Neurosurgery" },
            { id: "CT", name: "Cardiothoracic" },
            { id: "GS", name: "General Surgery" },
            { id: "US", name: "Urosurgery" },
            { id: "ENT", name: "ENT" },
            { id: "H", name: "Cardiology" },
            { id: "A", name: "Anesthesia" },
            { id: "R", name: "Radiology" },
            { id: "OR", name: "Orthopaedics" }
        ];

        // ========== TOAST SYSTEM ==========
        function showToast(message, type = 'info', duration = 3000) {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            const icons = {
                success: 'fa-check-circle',
                error: 'fa-exclamation-circle',
                info: 'fa-info-circle'
            };
            toast.className = `toast toast-${type}`;
            toast.innerHTML = `
                <i class="fas ${icons[type] || icons.info}"></i>
                <span>${message}</span>
                <button class="toast-close" onclick="this.parentElement.remove()">&times;</button>
            `;
            container.appendChild(toast);
            
            requestAnimationFrame(() => {
                toast.classList.add('show');
            });
            
            setTimeout(() => {
                toast.classList.remove('show');
                toast.classList.add('hide');
                setTimeout(() => {
                    if (toast.parentElement) toast.remove();
                }, 500);
            }, duration);
        }

        // ========== THEME ==========
        function toggleTheme() {
            document.getElementById('app-body').classList.toggle('light');
            document.getElementById('app-body').classList.toggle('dark');
            const isDark = document.getElementById('app-body').classList.contains('dark');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
        }

        // Load theme from localStorage
        if (localStorage.getItem('theme') === 'dark') {
            document.getElementById('app-body').classList.remove('light');
            document.getElementById('app-body').classList.add('dark');
        }

        // ========== ENTER KEY ==========
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                const lockScreen = document.getElementById('lock-screen');
                if (lockScreen && lockScreen.style.display !== 'none') {
                    e.preventDefault();
                    handleLogin();
                }
            }
        });

        // ========== LOGIN FUNCTION ==========
        async function handleLogin() {
            const input = document.getElementById('password-input');
            const err = document.getElementById('lock-error');
            const pwd = input.value;

            if (!pwd) {
                err.innerText = '❌ الرجاء إدخال كلمة المرور';
                input.focus();
                setTimeout(() => err.innerText = '', 2500);
                return;
            }

            err.innerText = '⏳ جاري التحقق...';

            try {
                const res = await fetch(`https://api.github.com/repos/${CONFIG.user}/${CONFIG.repo}/contents/${CONFIG.path}?t=${Date.now()}`, {
                    headers: { "Authorization": `token ${GH_TOKEN}` }
                });

                if (res.ok) {
                    const data = await res.json();
                    fileSha = data.sha;
                    const content = JSON.parse(decodeURIComponent(escape(atob(data.content.replace(/\s/g, '')))));

                    const userPass = content.passwords?.user || null;
                    const adminPass = content.passwords?.admin || null;

                    if (userPass && pwd === userPass) {
                        isAdmin = false;
                        err.innerText = '';
                        loginSuccess(content);
                        return;
                    } else if (adminPass && pwd === adminPass) {
                        isAdmin = true;
                        err.innerText = '';
                        loginSuccess(content);
                        return;
                    } else {
                        err.innerText = '❌ كلمة المرور غير صحيحة';
                        input.value = '';
                        input.focus();
                        setTimeout(() => err.innerText = '', 2500);
                        return;
                    }
                } else {
                    err.innerText = '❌ خطأ في الاتصال بقاعدة البيانات';
                    setTimeout(() => err.innerText = '', 2500);
                }
            } catch (error) {
                console.error("Login error:", error);
                err.innerText = '❌ خطأ في الاتصال بقاعدة البيانات';
                setTimeout(() => err.innerText = '', 2500);
            }
        }

        function loginSuccess(content) {
            db.names = (content.names || []).map(item => ({
                name: item.name || item[0] || "",
                spec: item.spec || item[1] || "NS",
                phone: item.phone || "",
                tag: item.tag || item.spec || item[1] || "NS",
                active: item.active !== undefined ? item.active : (item.spec !== "RESERVE")
            }));
            db.schedule = content.schedule || [];
            db.passwords = content.passwords || {};

            // Hide lock screen immediately
            document.getElementById('lock-screen').style.display = 'none';
            isLockScreenHidden = true;
            document.getElementById('main-content').classList.remove('hidden-content');

            if (isAdmin) {
                document.getElementById('admin-panel-btn').classList.remove('hidden');
            }

            if (document.getElementById('remember-me').checked) {
                const pwd = document.getElementById('password-input').value;
                localStorage.setItem('rememberToken', btoa(pwd));
                localStorage.setItem('rememberMe', 'true');
            } else {
                localStorage.removeItem('rememberToken');
                localStorage.removeItem('rememberMe');
            }

            renderResidents();
            isDataLoaded = true;
            showToast('تم تسجيل الدخول بنجاح', 'success');
        }

        // ========== AUTO-LOGIN - FIXED ==========
        (function() {
            const token = localStorage.getItem('rememberToken');
            const rememberMe = localStorage.getItem('rememberMe');
            
            // Only attempt auto-login if rememberMe is explicitly set to 'true'
            if (token && rememberMe === 'true' && !isAutoLoginAttempted) {
                isAutoLoginAttempted = true;
                try {
                    const pwd = atob(token);
                    performAutoLogin(pwd);
                } catch (e) {
                    console.error("Auto-login error:", e);
                }
            } else if (rememberMe !== 'true') {
                // If rememberMe is not set, clear any stale token
                localStorage.removeItem('rememberToken');
            }
        })();

        async function performAutoLogin(pwd) {
            try {
                const res = await fetch(`https://api.github.com/repos/${CONFIG.user}/${CONFIG.repo}/contents/${CONFIG.path}?t=${Date.now()}`, {
                    headers: { "Authorization": `token ${GH_TOKEN}` }
                });

                if (res.ok) {
                    const data = await res.json();
                    fileSha = data.sha;
                    const content = JSON.parse(decodeURIComponent(escape(atob(data.content.replace(/\s/g, '')))));

                    const userPass = content.passwords?.user || null;
                    const adminPass = content.passwords?.admin || null;

                    if ((userPass && pwd === userPass) || (adminPass && pwd === adminPass)) {
                        isAdmin = (adminPass && pwd === adminPass);
                        // Hide lock screen immediately - no flash
                        document.getElementById('lock-screen').style.display = 'none';
                        isLockScreenHidden = true;
                        document.getElementById('main-content').classList.remove('hidden-content');
                        if (isAdmin) {
                            document.getElementById('admin-panel-btn').classList.remove('hidden');
                        }
                        loginSuccess(content);
                        return;
                    }
                }
            } catch (e) {
                console.error("Auto-login load error:", e);
            }
            // If auto-login fails, show lock screen
            document.getElementById('lock-screen').style.display = 'flex';
            isLockScreenHidden = false;
            const input = document.getElementById('password-input');
            if (input) input.focus();
        }

        // ========== ADMIN PANEL ==========
        function toggleAdminPanel() {
            const panel = document.getElementById('admin-panel');
            panel.classList.toggle('hidden');
            if (!panel.classList.contains('hidden')) {
                const userPass = db.passwords?.user || '';
                const adminPass = db.passwords?.admin || '';
                document.getElementById('admin-pass-user').value = userPass;
                document.getElementById('admin-pass-admin').value = adminPass;
            }
        }

        function savePasswords() {
            const u = document.getElementById('admin-pass-user').value.trim();
            const a = document.getElementById('admin-pass-admin').value.trim();
            if (u.length < 3 || a.length < 3) {
                showToast('كلمة المرور يجب أن تكون 3 أحرف على الأقل', 'error');
                return;
            }

            db.passwords = { user: u, admin: a };
            showToast('تم تحديث كلمات المرور بنجاح', 'success');

            if (document.getElementById('remember-me').checked) {
                localStorage.setItem('rememberToken', btoa(u));
                localStorage.setItem('rememberMe', 'true');
            }
            saveToGithub();
        }

        // ========== RENDER ==========
        function renderResidents() {
            const list = document.getElementById('resident-list');
            const query = document.getElementById('search-db').value.toLowerCase();
            list.innerHTML = "";

            const activeRes = db.names.filter(r => r.spec !== "RESERVE" && r.name.toLowerCase().includes(query));
            const reserveRes = db.names.filter(r => r.spec === "RESERVE" && r.name.toLowerCase().includes(query));

            specialties.forEach(spec => {
                const residents = activeRes.filter(r => r.spec === spec.id);
                if (residents.length === 0) return;

                const isExpanded = query.length > 0 ? "active" : "";
                const section = document.createElement('div');
                section.className = "mb-2";
                section.innerHTML = `
                        <div class="spec-header" onclick="toggleSection('${spec.id}')">
                            <span><i class="fas fa-chevron-down text-[10px] ml-2 opacity-40"></i> ${spec.name}</span>
                            <span class="spec-count px-3 py-0.5 rounded-full text-[11px]">${residents.length}</span>
                        </div>
                        <div id="content-${spec.id}" class="spec-content ${isExpanded}">
                            ${residents.map((r) => {
                                const idx = db.names.indexOf(r);
                                return `
                                <div class="resident-card">
                                    <div class="flex-1 cursor-pointer" onclick="openEdit(${idx})">
                                        <div class="font-bold text-primary text-sm flex items-center gap-2 flex-wrap">
                                            ${r.name}
                                            <span class="badge-spec">${spec.id}</span>
                                            <span class="badge-active"><i class="fas fa-check-circle mr-1"></i> نشط</span>
                                        </div>
                                        <div class="text-[11px] text-secondary phone-ltr font-mono">${r.phone || ''}</div>
                                    </div>
                                    <button onclick="deleteResident(${idx})" class="text-secondary/30 hover:text-red-500 text-xs px-2 py-1 transition">
                                        <i class="far fa-trash-alt"></i>
                                    </button>
                                </div>`;
                            }).join('')}
                        </div>
                    `;
                list.appendChild(section);
            });

            if (reserveRes.length > 0) {
                const isExpanded = query.length > 0 ? "active" : "";
                const reserveSection = document.createElement('div');
                reserveSection.className = "mb-2";
                reserveSection.innerHTML = `
                        <div class="spec-header" onclick="toggleSection('reserve')">
                            <span><i class="fas fa-chevron-down text-[10px] ml-2 opacity-40"></i> 📋 الاحتياط (Reserve)</span>
                            <span class="spec-count-reserve px-3 py-0.5 rounded-full text-[11px]">${reserveRes.length}</span>
                        </div>
                        <div id="content-reserve" class="spec-content ${isExpanded}">
                            ${reserveRes.map((r) => {
                                const idx = db.names.indexOf(r);
                                const specObj = specialties.find(s => s.id === r.tag);
                                return `
                                <div class="resident-card">
                                    <div class="flex-1 cursor-pointer" onclick="openEdit(${idx})">
                                        <div class="font-bold text-primary text-sm flex items-center gap-2 flex-wrap">
                                            ${r.name}
                                            <span class="badge-spec">${specObj ? specObj.name : r.tag || r.spec}</span>
                                            <span class="badge-reserve"><i class="fas fa-clock mr-1"></i> احتياط</span>
                                        </div>
                                        <div class="text-[11px] text-secondary phone-ltr font-mono">${r.phone || ''}</div>
                                    </div>
                                    <button onclick="deleteResident(${idx})" class="text-secondary/30 hover:text-red-500 text-xs px-2 py-1 transition">
                                        <i class="far fa-trash-alt"></i>
                                    </button>
                                </div>`;
                            }).join('')}
                        </div>
                    `;
                list.appendChild(reserveSection);
            }

            const activeCount = db.names.filter(r => r.spec !== "RESERVE").length;
            document.getElementById('count-tag').innerHTML =
                `<i class="fas fa-users mr-1"></i> ${db.names.length} مسجل · ${activeCount} نشط`;
        }

        function toggleSection(id) {
            const el = document.getElementById(`content-${id}`);
            if (el) el.classList.toggle('active');
        }

        // ========== HELPERS ==========
        function formatIraqiPhone(num) {
            let clean = num.replace(/\D/g, '').trim();
            if (!clean) return "";
            if (clean.startsWith('07')) return '+964' + clean.substring(1);
            if (clean.startsWith('964')) return '+' + clean;
            if (clean.length === 10 && clean.startsWith('7')) return '+964' + clean;
            return num.trim();
        }

        function ensureDoctorTitle(name) {
            let n = name.trim();
            if (!n) return "";
            return (n.startsWith("د.") || n.startsWith("د ")) ? n : "د. " + n;
        }

        // ========== CRUD ==========
        function openEdit(idx) {
            currentEditIdx = idx;
            const r = db.names[idx];
            document.getElementById('edit-name').value = r.name;
            document.getElementById('edit-phone').value = r.phone || '';
            document.getElementById('edit-spec').value = r.tag || r.spec || "NS";
            document.getElementById('edit-active').checked = (r.spec !== "RESERVE");
            document.getElementById('edit-modal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('edit-modal').classList.remove('active');
        }

        async function saveEdit() {
            const nameVal = document.getElementById('edit-name').value;
            const phoneVal = document.getElementById('edit-phone').value;
            const specVal = document.getElementById('edit-spec').value;
            const isActive = document.getElementById('edit-active').checked;

            db.names[currentEditIdx] = {
                name: ensureDoctorTitle(nameVal),
                phone: formatIraqiPhone(phoneVal),
                spec: isActive ? specVal : "RESERVE",
                tag: specVal,
                active: isActive
            };
            closeModal();
            renderResidents();
            await saveToGithub();
            showToast('تم تعديل بيانات المقيم بنجاح', 'success');
        }

        async function deleteResident(idx) {
            if (!confirm("هل أنت متأكد من حذف هذا المقيم؟")) return;
            db.names.splice(idx, 1);
            renderResidents();
            await saveToGithub();
            showToast('تم حذف المقيم بنجاح', 'success');
        }

        async function addResident() {
            const nameEl = document.getElementById('new-name');
            const phoneEl = document.getElementById('new-phone');
            const specEl = document.getElementById('new-spec');
            const activeEl = document.getElementById('new-active');
            if (!nameEl.value.trim()) {
                showToast('الرجاء إدخال اسم المقيم', 'error');
                return;
            }

            const isActive = activeEl.checked;
            db.names.push({
                name: ensureDoctorTitle(nameEl.value),
                spec: isActive ? specEl.value : "RESERVE",
                tag: specEl.value,
                phone: formatIraqiPhone(phoneEl.value),
                active: isActive
            });
            nameEl.value = "";
            phoneEl.value = "";
            renderResidents();
            await saveToGithub();
            showToast('تم إضافة المقيم بنجاح', 'success');
        }

        // ========== SAVE ==========
        async function saveToGithub() {
            const btn = document.getElementById('main-save-btn');
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-pulse"></i> جاري';
            btn.classList.add('loading');

            try {
                db.passwords = db.passwords || {};

                const body = {
                    message: "Database Update 🇮🇶",
                    content: btoa(unescape(encodeURIComponent(JSON.stringify(db, null, 2))))
                };

                if (fileSha) {
                    body.sha = fileSha;
                }

                const res = await fetch(`https://api.github.com/repos/${CONFIG.user}/${CONFIG.repo}/contents/${CONFIG.path}`, {
                    method: "PUT",
                    headers: { "Authorization": `token ${GH_TOKEN}` },
                    body: JSON.stringify(body)
                });

                if (res.ok) {
                    const updated = await res.json();
                    fileSha = updated.content.sha;
                    btn.innerHTML = '<i class="fas fa-check-circle"></i> تم';
                    btn.classList.replace('loading', 'success');
                    showToast('تم حفظ البيانات بنجاح', 'success');
                } else {
                    throw new Error(await res.text());
                }
            } catch (e) {
                console.error("Save error:", e);
                btn.innerHTML = '<i class="fas fa-exclamation-triangle"></i> فشل';
                btn.classList.replace('loading', 'error');
                showToast('فشل حفظ البيانات', 'error');
            }
            setTimeout(() => {
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-cloud-upload-alt"></i> حفظ';
                btn.className = "btn-ghost text-[10px] font-black uppercase flex items-center gap-2 px-4 py-2";
            }, 2500);
        }

        // ========== EVENT LISTENERS ==========
        document.getElementById('edit-modal').addEventListener('click', function(e) {
            if (e.target === this) closeModal();
        });

        document.getElementById('new-name').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') addResident();
        });

        document.getElementById('remember-me').addEventListener('change', function() {
            if (!this.checked) {
                localStorage.removeItem('rememberToken');
                localStorage.removeItem('rememberMe');
            } else {
                // If checked, we'll save the token on next login
                const pwd = document.getElementById('password-input').value;
                if (pwd) {
                    localStorage.setItem('rememberToken', btoa(pwd));
                    localStorage.setItem('rememberMe', 'true');
                }
            }
        });

        // Set focus on password field if lock screen is visible
        document.addEventListener('DOMContentLoaded', function() {
            // Check if lock screen is visible (not hidden by auto-login)
            setTimeout(function() {
                const lockScreen = document.getElementById('lock-screen');
                if (lockScreen && lockScreen.style.display !== 'none') {
                    const passwordInput = document.getElementById('password-input');
                    if (passwordInput) passwordInput.focus();
                }
            }, 100);
        });
    </script>
</body>
</html>
