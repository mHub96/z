<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>لوحة التحكم · المشروع</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'IBM Plex Sans Arabic', sans-serif;
            direction: rtl;
            text-align: right;
            min-height: 100vh;
            padding: 0;
            transition: background 0.6s ease, color 0.4s ease;
            overflow-x: hidden;
        }

        /* ============================================================
           LIGHT THEME (مطابق لصفحة المقيمين)
        ============================================================ */
        body.light {
            background: #f2f6fc;
            color: #1a2332;
        }
        body.light .bg-surface {
            background: #ffffff;
        }
        body.light .bg-surface2 {
            background: #f8fafc;
        }
        body.light .text-primary {
            color: #1a2332;
        }
        body.light .text-secondary {
            color: #475569;
        }
        body.light .border-subtle {
            border-color: #e2e8f0;
        }
        body.light .glass-card {
            background: rgba(255, 255, 255, 0.78);
            backdrop-filter: blur(14px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.05);
            transition: all 0.3s ease;
        }
        body.light .glass-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 16px 48px rgba(0, 0, 0, 0.08);
        }
        body.light .btn-ghost {
            background: rgba(255, 255, 255, 0.5);
            border: 1px solid rgba(0, 0, 0, 0.08);
            color: #1a2332;
        }
        body.light .btn-ghost:hover {
            background: rgba(255, 255, 255, 0.8);
        }
        body.light .footer-credit {
            border-top-color: rgba(128, 128, 128, 0.1);
        }

        /* ============================================================
           DARK THEME — BLACK, GREY, GOLD (مطابق لصفحة المقيمين)
        ============================================================ */
        body.dark {
            background: #0b0e12;
            color: #e8edf5;
        }
        body.dark::before {
            content: '';
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            opacity: 0.08;
            background-image: url("data:image/svg+xml,%3Csvg width='120' height='120' viewBox='0 0 120 120' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23d4af37' fill-opacity='0.25'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
            background-size: 120px 120px;
        }

        body.dark .bg-surface {
            background: #141a24;
        }
        body.dark .bg-surface2 {
            background: #0f151e;
        }
        body.dark .text-primary {
            color: #f0f3f8;
        }
        body.dark .text-secondary {
            color: #a8b3c9;
        }
        body.dark .border-subtle {
            border-color: #2a3346;
        }

        body.dark .glass-card {
            background: rgba(16, 22, 34, 0.82);
            backdrop-filter: blur(14px);
            border: 1px solid rgba(212, 175, 55, 0.12);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
            transition: all 0.3s ease;
        }
        body.dark .glass-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 16px 48px rgba(0, 0, 0, 0.7);
        }

        body.dark .btn-ghost {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(212, 175, 55, 0.12);
            color: #f0f3f8;
        }
        body.dark .btn-ghost:hover {
            background: rgba(212, 175, 55, 0.08);
            border-color: rgba(212, 175, 55, 0.25);
        }

        body.dark .footer-credit {
            border-top-color: rgba(212, 175, 55, 0.05);
        }

        /* ============================================================
           SHARED STYLES
        ============================================================ */
        .glass-card {
            border-radius: 1.5rem;
            transition: all 0.3s ease;
            position: relative;
            z-index: 1;
        }

        .btn-gradient {
            border: none;
            font-weight: 700;
            padding: 0.9rem 2rem;
            border-radius: 1.2rem;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.6rem;
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            color: white;
            box-shadow: 0 8px 24px rgba(37, 99, 235, 0.3);
            text-decoration: none;
        }
        body.dark .btn-gradient {
            background: linear-gradient(135deg, #d4af37, #b8942e);
            box-shadow: 0 8px 24px rgba(212, 175, 55, 0.2);
            color: #0b0e12;
        }
        .btn-gradient:hover {
            transform: translateY(-2px) scale(1.01);
            box-shadow: 0 12px 32px rgba(37, 99, 235, 0.4);
        }
        body.dark .btn-gradient:hover {
            box-shadow: 0 12px 32px rgba(212, 175, 55, 0.3);
        }
        .btn-gradient:active {
            transform: scale(0.97);
        }

        .btn-ghost {
            border-radius: 1.2rem;
            padding: 0.6rem 1.4rem;
            font-weight: 600;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .footer-credit {
            font-size: 0.7rem;
            opacity: 0.5;
            padding: 0.8rem 0;
            text-align: center;
            border-top: 1px solid;
            margin-top: 2rem;
        }

        /* ============================================================
           THEME TOGGLE — ANIMATED FLIP (مطابق لصفحة المقيمين)
        ============================================================ */
        .theme-toggle-wrap {
            perspective: 200px;
            display: inline-block;
        }
        .theme-toggle-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: 2px solid;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            transform-style: preserve-3d;
            background: rgba(255, 255, 255, 0.3);
            border-color: rgba(0, 0, 0, 0.1);
        }
        body.dark .theme-toggle-btn {
            background: rgba(212, 175, 55, 0.08);
            border-color: rgba(212, 175, 55, 0.2);
        }
        .theme-toggle-btn .icon-wrap {
            position: relative;
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .theme-toggle-btn .icon-wrap i {
            position: absolute;
            font-size: 1.1rem;
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            backface-visibility: hidden;
        }
        .theme-toggle-btn .icon-wrap .icon-moon {
            transform: rotateY(0deg);
            opacity: 1;
        }
        .theme-toggle-btn .icon-wrap .icon-sun {
            transform: rotateY(180deg);
            opacity: 0;
        }
        body.dark .theme-toggle-btn .icon-wrap .icon-moon {
            transform: rotateY(-180deg);
            opacity: 0;
        }
        body.dark .theme-toggle-btn .icon-wrap .icon-sun {
            transform: rotateY(0deg);
            opacity: 1;
        }
        .theme-toggle-btn .icon-wrap i.fa-moon {
            color: #1a2332;
        }
        body.dark .theme-toggle-btn .icon-wrap i.fa-moon {
            color: #f0f3f8;
        }
        .theme-toggle-btn .icon-wrap i.fa-sun {
            color: #fbbf24;
        }
        .theme-toggle-btn:hover {
            transform: scale(1.05);
        }
        body.dark .theme-toggle-btn:hover {
            border-color: rgba(212, 175, 55, 0.4);
        }

        /* تحسينات للشاشات الصغيرة */
        @media (max-width: 640px) {
            .glass-card {
                padding: 1.5rem;
            }
        }
    </style>
</head>
<body class="light" id="app-body">

    <div class="max-w-4xl mx-auto px-4 py-8 md:py-12 relative z-10">

        <!-- Header with Theme Toggle -->
        <div class="flex justify-between items-center mb-12">
            <div>
                <div class="w-16 h-16 mb-3 rounded-full bg-gradient-to-br from-blue-500 to-blue-600 flex items-center justify-center shadow-lg shadow-blue-500/30">
                    <i class="fas fa-user-md text-2xl text-white"></i>
                </div>
                <h1 class="text-3xl md:text-4xl font-black text-primary tracking-tight">لوحة التحكم</h1>
                <p class="text-secondary mt-1 text-sm">مرحباً بك في مركز إدارة المشروع</p>
            </div>
            <div class="flex items-center gap-3">
                <!-- Animated Theme Toggle -->
                <div class="theme-toggle-wrap">
                    <button onclick="toggleTheme()" class="theme-toggle-btn" aria-label="Toggle theme">
                        <span class="icon-wrap">
                            <i class="fas fa-moon icon-moon"></i>
                            <i class="fas fa-sun icon-sun"></i>
                        </span>
                    </button>
                </div>
            </div>
        </div>

        <!-- Cards Grid -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 md:gap-8">

            <!-- بطاقة المقيمين -->
            <a href="https://mhub96.github.io/z/admin" target="_blank" class="glass-card p-6 md:p-8 text-center group block no-underline">
                <div class="w-16 h-16 mx-auto mb-4 rounded-full bg-blue-50 dark:bg-blue-950/30 flex items-center justify-center group-hover:bg-blue-100 dark:group-hover:bg-blue-900/40 transition-colors">
                    <i class="fas fa-address-book text-2xl text-blue-600 dark:text-amber-400"></i>
                </div>
                <h2 class="text-xl font-bold text-primary mb-2">المقيمين</h2>
                <p class="text-sm text-secondary mb-4">إدارة قاعدة بيانات المقيمين والأطباء</p>
                <span class="inline-block text-sm font-bold text-blue-600 dark:text-amber-400 group-hover:underline">
                    فتح التطبيق <i class="fas fa-arrow-left mr-1"></i>
                </span>
            </a>

            <!-- بطاقة الجدولة -->
            <a href="https://mhub96.github.io/z/s" target="_blank" class="glass-card p-6 md:p-8 text-center group block no-underline">
                <div class="w-16 h-16 mx-auto mb-4 rounded-full bg-emerald-50 dark:bg-emerald-950/30 flex items-center justify-center group-hover:bg-emerald-100 dark:group-hover:bg-emerald-900/40 transition-colors">
                    <i class="fas fa-calendar-check text-2xl text-emerald-600 dark:text-amber-400"></i>
                </div>
                <h2 class="text-xl font-bold text-primary mb-2">الجدولة</h2>
                <p class="text-sm text-secondary mb-4">تنظيم وجدولة مواعيد المناوبات</p>
                <span class="inline-block text-sm font-bold text-emerald-600 dark:text-amber-400 group-hover:underline">
                    فتح التطبيق <i class="fas fa-arrow-left mr-1"></i>
                </span>
            </a>

        </div>

        <!-- ملاحظة أو إضافة مستقبلية -->
        <div class="mt-12 glass-card p-4 md:p-6 text-center">
            <p class="text-sm text-secondary">
                <i class="fas fa-info-circle text-blue-500 dark:text-amber-400 ml-2"></i>
                سيتم إضافة المزيد من التطبيقات والخدمات قريباً.
            </p>
        </div>

        <!-- Footer -->
        <div class="footer-credit text-secondary">
            All rights reserved for Dr. Mohammed Riyadh
        </div>
    </div>

    <script>
        // ============================================================
        //  THEME TOGGLE — يطابق تماماً آلية صفحة المقيمين
        // ============================================================
        function toggleTheme() {
            document.getElementById('app-body').classList.toggle('light');
            document.getElementById('app-body').classList.toggle('dark');
            const isDark = document.getElementById('app-body').classList.contains('dark');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
        }

        // تحميل الثيم المخزن في localStorage
        (function loadTheme() {
            const savedTheme = localStorage.getItem('theme');
            if (savedTheme === 'dark') {
                document.getElementById('app-body').classList.remove('light');
                document.getElementById('app-body').classList.add('dark');
            }
            // إذا لم يكن هناك قيمة مخزنة، يبقى الوضع الافتراضي (light)
        })();
    </script>

</body>
</html>
