<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>لوحة التحكم · المشروع</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <style>
        /* نفس الأنماط المستخدمة في التطبيقات الأخرى للتناسق */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'IBM Plex Sans Arabic', sans-serif;
            direction: rtl;
            text-align: right;
            min-height: 100vh;
            padding: 0;
            transition: background 0.6s ease, color 0.4s ease;
            background: #f2f6fc;
            color: #1a2332;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.78);
            backdrop-filter: blur(14px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.05);
            border-radius: 1.5rem;
            transition: all 0.3s ease;
        }
        .glass-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 16px 48px rgba(0, 0, 0, 0.08);
        }
        .btn-gradient {
            border: none;
            font-weight: 700;
            padding: 0.9rem 2rem;
            border-radius: 1.2rem;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.6rem;
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            color: white;
            box-shadow: 0 8px 24px rgba(37, 99, 235, 0.3);
            text-decoration: none;
        }
        .btn-gradient:hover {
            transform: translateY(-2px) scale(1.01);
            box-shadow: 0 12px 32px rgba(37, 99, 235, 0.4);
        }
        .btn-gradient:active { transform: scale(0.97); }
        .footer-credit {
            font-size: 0.7rem;
            opacity: 0.4;
            padding: 0.8rem 0;
            text-align: center;
            border-top: 1px solid rgba(128, 128, 128, 0.1);
            margin-top: 2rem;
        }
        /* تحسينات للشاشات الصغيرة */
        @media (max-width: 640px) {
            .glass-card { padding: 1.5rem; }
        }
    </style>
</head>
<body>
    <div class="max-w-4xl mx-auto px-4 py-8 md:py-12">
        <!-- Header -->
        <div class="text-center mb-12">
            <div class="w-20 h-20 mx-auto mb-4 rounded-full bg-gradient-to-br from-blue-500 to-blue-600 flex items-center justify-center shadow-lg shadow-blue-500/30">
                <i class="fas fa-user-md text-3xl text-white"></i>
            </div>
            <h1 class="text-3xl md:text-4xl font-black text-slate-800 tracking-tight">لوحة التحكم</h1>
            <p class="text-slate-500 mt-2">مرحباً بك في مركز إدارة المشروع</p>
        </div>

        <!-- Cards Grid -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 md:gap-8">
            <!-- بطاقة المقيمين -->
            <a href="https://mhub96.github.io/z/admin" target="_blank" class="glass-card p-6 md:p-8 text-center group">
                <div class="w-16 h-16 mx-auto mb-4 rounded-full bg-blue-50 flex items-center justify-center group-hover:bg-blue-100 transition-colors">
                    <i class="fas fa-address-book text-2xl text-blue-600"></i>
                </div>
                <h2 class="text-xl font-bold text-slate-800 mb-2">المقيمين</h2>
                <p class="text-sm text-slate-500 mb-4">إدارة قاعدة بيانات المقيمين والأطباء</p>
                <span class="inline-block text-sm font-bold text-blue-600 group-hover:underline">
                    فتح التطبيق <i class="fas fa-arrow-left mr-1"></i>
                </span>
            </a>

            <!-- بطاقة الجدولة -->
            <a href="https://mhub96.github.io/z/s" target="_blank" class="glass-card p-6 md:p-8 text-center group">
                <div class="w-16 h-16 mx-auto mb-4 rounded-full bg-emerald-50 flex items-center justify-center group-hover:bg-emerald-100 transition-colors">
                    <i class="fas fa-calendar-check text-2xl text-emerald-600"></i>
                </div>
                <h2 class="text-xl font-bold text-slate-800 mb-2">الجدولة</h2>
                <p class="text-sm text-slate-500 mb-4">تنظيم وجدولة مواعيد المناوبات</p>
                <span class="inline-block text-sm font-bold text-emerald-600 group-hover:underline">
                    فتح التطبيق <i class="fas fa-arrow-left mr-1"></i>
                </span>
            </a>
        </div>

        <!-- ملاحظة أو إضافة مستقبلية -->
        <div class="mt-12 glass-card p-4 md:p-6 text-center">
            <p class="text-sm text-slate-600">
                <i class="fas fa-info-circle text-blue-500 ml-2"></i>
                سيتم إضافة المزيد من التطبيقات والخدمات قريباً.
            </p>
        </div>

        <!-- Footer -->
        <div class="footer-credit text-slate-500">
            All rights reserved for Dr. Mohammed Riyadh
        </div>
    </div>
</body>
</html>
